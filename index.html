<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クロマトグラフィー 散布図ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --card: #181a24;
    --card2: #1e2130;
    --border: #2a2d3e;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --accent: #6c7fe8;
    --accent-hover: #7f90f0;
    --btn-bg: #252840;
    --btn-hover: #2e3252;
    --radius: 12px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 32px;
    text-align: center;
  }

  header h1 {
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #fff;
  }

  header p {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    font-size: 0.83rem;
    color: var(--text-muted);
  }
  .drop-zone.over {
    border-color: var(--accent);
    background: rgba(108,127,232,0.07);
  }
  .drop-zone input[type="file"] { display: none; }

  textarea {
    width: 100%;
    height: 220px;
    background: #12141e;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    line-height: 1.6;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    padding: 9px 22px;
    transition: background 0.18s, transform 0.1s;
  }
  button:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--btn-bg);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--btn-hover); }

  .error-msg {
    margin-top: 10px;
    font-size: 0.82rem;
    color: #f87171;
    display: none;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    border-radius: 8px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.83rem;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #emptyState {
    text-align: center;
    padding: 60px 0 40px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  #emptyState svg {
    display: block;
    margin: 0 auto 14px;
    opacity: 0.3;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>クロマトグラフィー 散布図ツール</h1>
    <p>フラクションデータを入力してタンパク質活性の散布図を生成します</p>
  </header>

  <div class="card">
    <h2>データ入力</h2>
    <div class="drop-zone" id="dropZone">
      <label for="fileInput" style="cursor:pointer;">
        CSVファイルをここにドロップ、またはクリックして選択
      </label>
      <input type="file" id="fileInput" accept=".csv,text/plain">
    </div>
    <textarea id="csvInput" spellcheck="false" placeholder="CSVデータをここに貼り付けてください…"></textarea>
    <div class="actions">
      <button class="btn-primary" id="plotBtn">グラフ生成</button>
      <button class="btn-secondary" id="clearBtn">クリア</button>
      <button class="btn-secondary" id="sampleBtn">サンプルデータ読み込み</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="card">
    <h2>散布図</h2>
    <div class="chart-wrap">
      <div id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="3"/><circle cx="17" cy="5" r="2"/><circle cx="5" cy="16" r="2"/>
          <circle cx="15" cy="15" r="3"/>
          <path d="M3 21l18-18"/>
        </svg>
        データを入力して「グラフ生成」ボタンを押してください
      </div>
      <canvas id="chart" style="display:none;"></canvas>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
// ─── SAMPLE DATA ────────────────────────────────────────────────────────────
const SAMPLE = `Fraction,Protein A,Protein B,Protein C
1,0.05,0.02,0.10
2,0.35,0.05,0.40
3,1.20,0.08,1.50
4,2.85,0.15,3.80
5,4.50,0.30,7.20
6,4.92,0.65,10.5
7,3.80,1.45,11.8
8,2.10,2.90,10.2
9,0.85,4.35,6.80
10,0.30,4.95,3.50
11,0.10,3.80,1.20
12,0.03,1.85,0.35
13,0.01,0.55,0.08`;

// ─── COLORS ─────────────────────────────────────────────────────────────────
const PALETTE = [
  { dot: '#f472b6', line: '#f472b6', fill: 'rgba(244,114,182,0.10)' },
  { dot: '#60a5fa', line: '#60a5fa', fill: 'rgba(96,165,250,0.10)' },
  { dot: '#34d399', line: '#34d399', fill: 'rgba(52,211,153,0.10)' },
  { dot: '#fb923c', line: '#fb923c', fill: 'rgba(251,146,60,0.10)'  },
  { dot: '#a78bfa', line: '#a78bfa', fill: 'rgba(167,139,250,0.10)' },
];

// ─── PCHIP IMPLEMENTATION ───────────────────────────────────────────────────
function pchipDerivatives(xs, ys) {
  const n = xs.length;
  const d = new Array(n).fill(0);
  const delta = [];
  const h = [];

  for (let i = 0; i < n - 1; i++) {
    h.push(xs[i + 1] - xs[i]);
    delta.push((ys[i + 1] - ys[i]) / h[i]);
  }

  // Endpoints: one-sided differences
  d[0] = delta[0];
  d[n - 1] = delta[n - 2];

  for (let i = 1; i < n - 1; i++) {
    if (delta[i - 1] * delta[i] <= 0) {
      d[i] = 0;
    } else {
      const w1 = 2 * h[i] + h[i - 1];
      const w2 = h[i] + 2 * h[i - 1];
      d[i] = (w1 + w2) / (w1 / delta[i - 1] + w2 / delta[i]);
    }
  }

  return d;
}

function pchipInterpolate(xs, ys, t) {
  const n = xs.length;
  const d = pchipDerivatives(xs, ys);

  // Find segment
  let k = 0;
  for (let i = 0; i < n - 2; i++) {
    if (t >= xs[i]) k = i;
  }

  const h = xs[k + 1] - xs[k];
  const u = (t - xs[k]) / h;

  // Hermite basis functions
  const h00 = (1 + 2 * u) * (1 - u) * (1 - u);
  const h10 = u * (1 - u) * (1 - u);
  const h01 = u * u * (3 - 2 * u);
  const h11 = u * u * (u - 1);

  return h00 * ys[k] + h10 * h * d[k] + h01 * ys[k + 1] + h11 * h * d[k + 1];
}

// ─── CSV PARSER ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length < 2) throw new Error('データが不足しています（ヘッダー＋最低1行）');

  const header = lines[0].split(',').map(s => s.trim());
  if (header.length < 2) throw new Error('列が不足しています（フラクション番号＋最低1列のデータ）');

  const labels = header.slice(1);
  const fractions = [];
  const datasets = labels.map(() => []);

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(s => s.trim());
    const frac = parseFloat(cols[0]);
    if (isNaN(frac)) throw new Error(`行 ${i + 1} のフラクション番号が無効です`);
    fractions.push(frac);
    for (let j = 0; j < labels.length; j++) {
      const v = parseFloat(cols[j + 1]);
      if (isNaN(v)) throw new Error(`行 ${i + 1}, 列 "${labels[j]}" の値が無効です`);
      datasets[j].push(v);
    }
  }

  return { labels, fractions, datasets };
}

// ─── CHART DRAWING ──────────────────────────────────────────────────────────
const MARGIN_TOP    = 30;
const MARGIN_BOTTOM = 50;
const MARGIN_LEFT   = 70;
const AXIS_OFFSET   = 55;

function niceRange(max) {
  if (max <= 0) max = 1;
  const rawStep = max / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let step;
  if (norm <= 1.5) step = 1;
  else if (norm <= 3) step = 2;
  else if (norm <= 7) step = 5;
  else step = 10;
  step *= mag;
  const niceMax = Math.ceil(max / step) * step;
  return { max: niceMax, step };
}

function drawChart(data) {
  const canvas = document.getElementById('chart');
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth;
  const cssHeight = Math.max(380, Math.round(cssWidth * 0.5));

  canvas.style.width  = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  canvas.width  = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const W = cssWidth;
  const H = cssHeight;
  const { labels, fractions, datasets } = data;
  const n = labels.length;

  // ── Margins ──
  const rightAxes = Math.max(0, n - 1);
  const marginRight = 20 + rightAxes * AXIS_OFFSET;

  const plotX0 = MARGIN_LEFT;
  const plotX1 = W - marginRight;
  const plotY0 = MARGIN_TOP;
  const plotY1 = H - MARGIN_BOTTOM;
  const plotW  = plotX1 - plotX0;
  const plotH  = plotY1 - plotY0;

  // ── Scale each dataset ──
  const scales = datasets.map(ds => niceRange(Math.max(...ds)));

  // ── X range ──
  const xMin = Math.min(...fractions);
  const xMax = Math.max(...fractions);
  const xRange = xMax - xMin || 1;

  function toCanvasX(frac) {
    return plotX0 + ((frac - xMin) / xRange) * plotW;
  }
  function toCanvasY(val, scaleIdx) {
    return plotY1 - (val / scales[scaleIdx].max) * plotH;
  }

  // ── Background ──
  ctx.fillStyle = '#12141e';
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 8);
  ctx.fill();

  // ── Grid ──
  const gridSteps = 5;
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= gridSteps; i++) {
    const y = plotY0 + (plotH / gridSteps) * i;
    ctx.beginPath();
    ctx.moveTo(plotX0, y);
    ctx.lineTo(plotX1, y);
    ctx.stroke();
  }
  // Vertical grid
  const xTicks = fractions;
  xTicks.forEach(frac => {
    const x = toCanvasX(frac);
    ctx.beginPath();
    ctx.moveTo(x, plotY0);
    ctx.lineTo(x, plotY1);
    ctx.stroke();
  });

  // ── Draw Y axes ──
  function drawYAxis(dsIdx, xPos, side) {
    const col = PALETTE[dsIdx % PALETTE.length];
    const { max, step } = scales[dsIdx];
    const nSteps = Math.round(max / step);

    // Axis line (thin colored)
    ctx.strokeStyle = col.line + '55';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(xPos, plotY0);
    ctx.lineTo(xPos, plotY1);
    ctx.stroke();

    ctx.fillStyle = col.dot;
    ctx.font = "500 10px 'JetBrains Mono', monospace";
    ctx.textAlign = side === 'left' ? 'right' : 'left';

    for (let i = 0; i <= nSteps; i++) {
      const val = i * step;
      const y = plotY1 - (val / max) * plotH;
      const label = val % 1 === 0 ? val.toString() : val.toFixed(2);
      const tickDir = side === 'left' ? -1 : 1;
      ctx.strokeStyle = col.line + '55';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xPos, y);
      ctx.lineTo(xPos + tickDir * 5, y);
      ctx.stroke();
      ctx.fillStyle = col.dot;
      ctx.fillText(label, xPos + tickDir * 8, y + 3.5);
    }

    // Axis label (rotated)
    ctx.save();
    ctx.translate(xPos + (side === 'left' ? -48 : 48), plotY0 + plotH / 2);
    ctx.rotate(side === 'left' ? -Math.PI / 2 : Math.PI / 2);
    ctx.fillStyle = col.dot;
    ctx.font = "600 11px 'DM Sans', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(labels[dsIdx], 0, 0);
    ctx.restore();
  }

  // Left axis: dataset 0
  drawYAxis(0, plotX0, 'left');

  // Right axes: datasets 1, 2, 3, ...
  for (let i = 1; i < n; i++) {
    const xPos = plotX1 + (i - 1) * AXIS_OFFSET;
    drawYAxis(i, xPos, 'right');
  }

  // ── X axis ──
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(plotX0, plotY1);
  ctx.lineTo(plotX1, plotY1);
  ctx.stroke();

  ctx.fillStyle = '#8892a4';
  ctx.font = "400 10px 'JetBrains Mono', monospace";
  ctx.textAlign = 'center';
  fractions.forEach(frac => {
    const x = toCanvasX(frac);
    ctx.fillText(frac, x, plotY1 + 18);
  });

  // X axis label
  ctx.fillStyle = '#8892a4';
  ctx.font = "600 11px 'DM Sans', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('フラクション番号', plotX0 + plotW / 2, H - 8);

  // ── Draw curves + fills + dots per dataset ──
  const CURVE_SAMPLES = 200;

  for (let di = 0; di < n; di++) {
    const col = PALETTE[di % PALETTE.length];
    const ys = datasets[di];

    // Build interpolated curve points
    const curveX = [];
    const curveY = [];
    for (let s = 0; s <= CURVE_SAMPLES; s++) {
      const t = xMin + (s / CURVE_SAMPLES) * xRange;
      const interpVal = pchipInterpolate(fractions, ys, t);
      curveX.push(toCanvasX(t));
      curveY.push(toCanvasY(Math.max(0, interpVal), di));
    }

    // Area fill
    ctx.beginPath();
    ctx.moveTo(curveX[0], plotY1);
    for (let s = 0; s <= CURVE_SAMPLES; s++) {
      ctx.lineTo(curveX[s], curveY[s]);
    }
    ctx.lineTo(curveX[CURVE_SAMPLES], plotY1);
    ctx.closePath();
    ctx.fillStyle = col.fill;
    ctx.fill();

    // Curve line
    ctx.beginPath();
    ctx.moveTo(curveX[0], curveY[0]);
    for (let s = 1; s <= CURVE_SAMPLES; s++) {
      ctx.lineTo(curveX[s], curveY[s]);
    }
    ctx.strokeStyle = col.line;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Data points (dots)
    fractions.forEach((frac, fi) => {
      const cx = toCanvasX(frac);
      const cy = toCanvasY(ys[fi], di);
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = col.dot;
      ctx.fill();
      ctx.strokeStyle = '#12141e';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  // ── Clip to plot area (overdraw guard) ──
  // Already handled by only drawing within bounds
}

// ─── LEGEND ──────────────────────────────────────────────────────────────────
function buildLegend(labels) {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  labels.forEach((name, i) => {
    const col = PALETTE[i % PALETTE.length];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${col.dot}"></span><span>${name}</span>`;
    el.appendChild(item);
  });
}

// ─── MAIN FLOW ───────────────────────────────────────────────────────────────
let currentData = null;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  document.getElementById('errorMsg').style.display = 'none';
}

function render(csvText) {
  clearError();
  let data;
  try {
    data = parseCSV(csvText);
  } catch (e) {
    showError(e.message);
    return;
  }
  currentData = data;
  document.getElementById('emptyState').style.display = 'none';
  const canvas = document.getElementById('chart');
  canvas.style.display = 'block';
  drawChart(data);
  buildLegend(data.labels);
}

document.getElementById('plotBtn').addEventListener('click', () => {
  render(document.getElementById('csvInput').value);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  document.getElementById('csvInput').value = '';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('chart').style.display = 'none';
  document.getElementById('legend').innerHTML = '';
  clearError();
  currentData = null;
});

document.getElementById('sampleBtn').addEventListener('click', () => {
  document.getElementById('csvInput').value = SAMPLE;
  clearError();
});

// ── File drag & drop ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file) readFile(file);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) readFile(fileInput.files[0]);
});

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('csvInput').value = e.target.result;
    clearError();
  };
  reader.readAsText(file, 'UTF-8');
}

// ── Responsive redraw ──
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentData) drawChart(currentData);
  }, 120);
});

// ── Init: load sample ──
document.getElementById('csvInput').value = SAMPLE;
</script>
</body>
</html>
